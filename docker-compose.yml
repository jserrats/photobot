services:
  photobot:
    container_name: photobot
    image: ghcr.io/jserrats/photobot:latest
    build: .
    restart: unless-stopped
    # Runs as uid/gid 1000 inside the image; override if the storage directory is owned by someone else.
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    # Values come from compose interpolation: a .env file next to this compose file,
    # the shell, or the "Environment variables" page of a container manager UI.
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN is required (token from @BotFather)}
      DEVELOPER_CHAT_ID: ${DEVELOPER_CHAT_ID:?DEVELOPER_CHAT_ID is required (numeric chat id)}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DOWNLOAD_DIR: /files
      # Local time zone for the "Today"/"Yesterday" buttons of the capture-date prompt.
      TZ: ${TZ:-UTC}
      DATE_PROMPT_WINDOW_SECONDS: ${DATE_PROMPT_WINDOW_SECONDS:-30}
    volumes:
      # Host directory where pictures and videos are stored (default ./files).
      - ${HOST_FILES_DIR:-./files}:/files
